# ============================================================
# tpv  —  Phase 2: Mid-training on nuScenes BEV
# ============================================================
# Fine-tunes the pretrained TPV encoder on real nuScenes data.
# Goal: align synthetic features to real sensor noise,
# occlusion, and scene diversity.
#
# Requires: nuscenes-devkit + nuScenes v1.0-trainval dataset
# Install: pip install nuscenes-devkit
# Data:    https://www.nuscenes.org/nuscenes
# ============================================================

inherits: base.yaml

data:
  source: nuscenes
  stage: mid_train
  nuscenes:
    data_root: null             # REQUIRED: /path/to/nuscenes
    version: v1.0-trainval
    map_classes:
      - drivable_surface
      - ped_crossing
      - walkway
      - stop_line
      - carpark_area
      - divider
  train_split: train
  val_split: val
  img_size: [448, 800]          # full nuScenes camera resolution
  num_workers: 4

train:
  epochs: 24
  batch_size: 4
  lr: 2.0e-4
  warmup_epochs: 2
  lr_scheduler: cosine
  weight_decay: 0.01
  grad_clip: 35.0
  grad_accum_steps: 2
  checkpoint_every_n_epochs: 4

model:
  tpv_h: 200
  tpv_w: 200
  tpv_z: 16
  n_cameras: 6
  backbone_freeze: false
  heads:
    bev_seg:
      enabled: true
      n_classes: 6
    occ_3d:
      enabled: false
    depth:
      enabled: false

logging:
  backend: tensorboard
  tensorboard: true
  log_every_n_steps: 50

eval:
  enabled: true
  every_n_epochs: 4
  metrics:
    - miou_bev
  visualise_pred: true
