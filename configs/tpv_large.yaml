# ============================================================
# tpv  —  Model variant: TPV-Large
# ============================================================
# High-capacity model for best benchmark performance.
# ~65M parameters. Requires A100 / H100 for batch_size > 1.
# ============================================================

inherits: base.yaml
variant: tpv_large

model:
  backbone: swin_b
  backbone_pretrained: true
  embed_dims: 256
  num_heads: 16
  num_encoder_layers: 6
  num_decoder_layers: 6
  feedforward_channels: 1024
  dropout: 0.1

train:
  batch_size: 1
  grad_accum_steps: 8
  lr: 1.0e-4
